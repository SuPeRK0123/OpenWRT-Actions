name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - mt7981
      version:
        description: 'OpenWrt version tag (e.g. v24.10.4)'
        required: true
        default: 'v25.12.2'
      lan_ip:
        description: 'LAN IP address'
        required: true
        default: '192.168.1.1'
      rootfs_size:
        description: 'Root filesystem size in MB (x86_64 only)'
        required: true
        default: '512'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget qemu-utils

      - name: Clone OpenWrt source
        run: |
          git clone https://github.com/openwrt/openwrt.git \
            --branch ${{ github.event.inputs.version }} \
            --depth=1

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add custom packages
        working-directory: openwrt
        run: |
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon \
            package/luci-theme-argon

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ github.event.inputs.target }}-${{ github.event.inputs.version }}

      - name: Load config fragment
        run: |
          cp config/${{ github.event.inputs.target }}.config openwrt/.config
          # 追加参数化配置
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.rootfs_size }}" >> openwrt/.config
          cd openwrt && make defconfig

      - name: Apply custom settings
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cat > openwrt/files/etc/uci-defaults/99-custom << 'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='${{ github.event.inputs.lan_ip }}'
          uci commit network
          exit 0
          EOF

      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s 2>&1 | tail -n 50

      - name: Save toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ github.event.inputs.target }}-${{ github.event.inputs.version }}

      - name: Collect firmware files
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets -type f \( \
            -name "*.img.gz" \
            -o -name "*.bin" \
            -o -name "sha256sums" \
          \) -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ github.event.inputs.target }}-${{ github.event.inputs.version }}
          path: artifacts/
          retention-days: 30
