name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - mt7981
      version:
        description: 'OpenWrt version tag (e.g. v25.12.5)'
        required: true
        default: 'v25.12.5'
      ip_mode:
        description: 'LAN IP 分配方式'
        required: true
        default: 'static'
        type: choice
        options:
          - static
          - dhcp
      lan_ip:
        description: 'LAN 静态 IP（仅 static 模式生效）'
        required: false
        default: '192.168.1.1'
      mode:
        description: 'Router mode'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - bypass
      gateway:
        description: 'Gateway IP (bypass mode only, e.g. 192.168.1.1)'
        required: false
        default: '192.168.1.1'
      rootfs_size:
        description: 'Root filesystem size in MB (x86_64 only)'
        required: true
        default: '512'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 仅人工触发时保存本次参数，供 daily-rebuild.yml 读取复用
      # bot 触发（check-update、daily-rebuild）跳过此步，避免覆盖你的配置
      - name: Save inputs for daily rebuild
        if: github.actor != 'github-actions[bot]'
        run: |
          cat > last-build-inputs.json << JSON
          {
            "target":      "${{ github.event.inputs.target }}",
            "version":     "${{ github.event.inputs.version }}",
            "ip_mode":     "${{ github.event.inputs.ip_mode }}",
            "lan_ip":      "${{ github.event.inputs.lan_ip }}",
            "mode":        "${{ github.event.inputs.mode }}",
            "gateway":     "${{ github.event.inputs.gateway }}",
            "rootfs_size": "${{ github.event.inputs.rootfs_size }}"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-build-inputs.json
          # 若文件无变化则跳过 commit，避免空提交报错
          git diff --staged --quiet || git commit -m "chore: save last manual build inputs [skip ci]"
          git push

      - name: Get build time
        id: time
        run: echo "value=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget qemu-utils

      - name: Clone OpenWrt source
        run: |
          git clone https://github.com/openwrt/openwrt.git \
            --branch ${{ github.event.inputs.version }} \
            --depth=1

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add custom packages
        working-directory: openwrt
        run: |
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora \
            package/luci-theme-aurora
          git clone --depth=1 https://github.com/eamonxg/luci-app-aurora-config \
            package/luci-app-aurora-config

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ github.event.inputs.target }}-${{ github.event.inputs.version }}-${{ hashFiles('config/*.config') }}

      - name: Load config fragment
        run: |
          cat config/common.config config/${{ github.event.inputs.target }}.config > openwrt/.config
          if [ "${{ github.event.inputs.target }}" = "x86_64" ]; then
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.rootfs_size }}" >> openwrt/.config
          fi
          cd openwrt && make defconfig

      - name: Apply custom settings
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cat > openwrt/files/etc/uci-defaults/99-custom << 'SCRIPT'
          #!/bin/sh
          # ── 系统基础 ──────────────────────────────────
          uci set system.@system[0].hostname='OpenWrt'
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          # NTP 服务器
          uci del system.ntp.server
          uci add_list system.ntp.server='ntp.aliyun.com'
          uci add_list system.ntp.server='ntp.tencent.com'
          uci add_list system.ntp.server='time.xtracloud.net'
          uci commit system
          # ── 网络 ──────────────────────────────────────
          if [ '${{ github.event.inputs.ip_mode }}' = 'static' ]; then
            uci set network.lan.proto='static'
            uci set network.lan.ipaddr='${{ github.event.inputs.lan_ip }}'
            uci set network.lan.netmask='255.255.255.0'
          else
            uci set network.lan.proto='dhcp'
          fi
          # 旁路由模式额外配置
          if [ '${{ github.event.inputs.mode }}' = 'bypass' ]; then
            uci set network.lan.gateway='${{ github.event.inputs.gateway }}'
            uci set network.lan.dns='${{ github.event.inputs.gateway }}'
            uci commit network
            # 旁路由不应运行 DHCP 服务，否则会与主路由冲突
            uci set dhcp.lan.ignore='1'
            uci commit dhcp
          else
            uci commit network
          fi
          # ── LuCI ──────────────────────────────────────
          uci set luci.main.mediaurlbase='/luci-static/aurora'
          uci commit luci
          # ── 服务开机状态 ───────────────────────────────
          /etc/init.d/ddns disable
          exit 0
          SCRIPT
          chmod +x openwrt/files/etc/uci-defaults/99-custom

      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j$(nproc) || make download -j1 V=s

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        working-directory: openwrt
        run: |
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Save toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ github.event.inputs.target }}-${{ github.event.inputs.version }}-${{ hashFiles('config/*.config') }}

      - name: Collect firmware files
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets -type f \( \
            -name "*.img.gz" \
            -o -name "*.bin" \
            -o -name "sha256sums" \
          \) -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ github.event.inputs.target }}-${{ github.event.inputs.version }}
          path: artifacts/
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: openwrt-${{ github.event.inputs.target }}-${{ github.event.inputs.mode }}-${{ github.event.inputs.version }}
          name: "OpenWrt ${{ github.event.inputs.version }} (${{ github.event.inputs.target }} / ${{ github.event.inputs.mode }})"
          body: |
            ## OpenWrt ${{ github.event.inputs.version }} - ${{ github.event.inputs.target }}

            **编译时间**: ${{ steps.time.outputs.value }} (UTC+8)
            **路由模式**: ${{ github.event.inputs.mode == 'bypass' && '旁路由' || '主路由' }}
            **IP 模式**: ${{ github.event.inputs.ip_mode == 'static' && '静态 IP' || 'DHCP' }}
            ${{ github.event.inputs.ip_mode == 'static' && format('**LAN IP**: {0}', github.event.inputs.lan_ip) || '' }}
            ${{ github.event.inputs.mode == 'bypass' && format('**网关**: {0}', github.event.inputs.gateway) || '' }}
            **Root 分区**: ${{ github.event.inputs.rootfs_size }} MB（仅 x86_64）

            ### 文件说明 (x86_64)
            - `*-ext4-combined-efi.img.gz` → 推荐，UEFI 启动 + ext4
            - `*-squashfs-combined-efi.img.gz` → UEFI 启动 + squashfs（支持恢复出厂）

            ### 文件说明 (mt7981)
            - `*-squashfs-sysupgrade.bin` → 从原厂或 OpenWrt 升级用

          files: artifacts/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
