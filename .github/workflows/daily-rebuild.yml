name: Daily Rebuild (Latest Packages)

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:

jobs:
  replay-last-manual-build:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read last manual build inputs
        id: last
        run: |
          if [ ! -f last-build-inputs.json ]; then
            echo "::error::未找到 last-build-inputs.json，请先手动触发一次 build-openwrt.yml"
            exit 1
          fi

          echo "✅ 读取到上次手动编译参数："
          cat last-build-inputs.json | jq .

          echo "target=$(cat last-build-inputs.json      | jq -r '.target')"                  >> $GITHUB_OUTPUT
          echo "version=$(cat last-build-inputs.json     | jq -r '.version')"                 >> $GITHUB_OUTPUT
          echo "ip_mode=$(cat last-build-inputs.json     | jq -r '.ip_mode // "static"')"    >> $GITHUB_OUTPUT
          echo "lan_ip=$(cat last-build-inputs.json      | jq -r '.lan_ip')"                  >> $GITHUB_OUTPUT
          echo "mode=$(cat last-build-inputs.json        | jq -r '.mode')"                    >> $GITHUB_OUTPUT
          echo "gateway=$(cat last-build-inputs.json     | jq -r '.gateway')"                 >> $GITHUB_OUTPUT
          echo "rootfs_size=$(cat last-build-inputs.json | jq -r '.rootfs_size')"             >> $GITHUB_OUTPUT

      - name: Trigger build with same inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-openwrt.yml \
            -f target="${{ steps.last.outputs.target }}" \
            -f version="${{ steps.last.outputs.version }}" \
            -f ip_mode="${{ steps.last.outputs.ip_mode }}" \
            -f lan_ip="${{ steps.last.outputs.lan_ip }}" \
            -f mode="${{ steps.last.outputs.mode }}" \
            -f gateway="${{ steps.last.outputs.gateway }}" \
            -f rootfs_size="${{ steps.last.outputs.rootfs_size }}"

          echo "🚀 已触发每日重建，参数如下："
          echo "  target      : ${{ steps.last.outputs.target }}"
          echo "  version     : ${{ steps.last.outputs.version }}"
          echo "  ip_mode     : ${{ steps.last.outputs.ip_mode }}"
          echo "  lan_ip      : ${{ steps.last.outputs.lan_ip }}"
          echo "  mode        : ${{ steps.last.outputs.mode }}"
          echo "  gateway     : ${{ steps.last.outputs.gateway }}"
          echo "  rootfs_size : ${{ steps.last.outputs.rootfs_size }} MB"
