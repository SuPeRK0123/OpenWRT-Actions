name: Check for OpenWrt Updates

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 运行，约北京时间 10:00
  workflow_dispatch:        # 也支持手动触发，方便测试

jobs:
  check-and-trigger:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest OpenWrt release
        id: latest
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/openwrt/openwrt/releases/latest" \
            | grep '"tag_name"' | cut -d'"' -f4)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream: $LATEST"

      - name: Compare with current version
        id: check
        run: |
          CURRENT=$(cat version.txt | tr -d '[:space:]')
          LATEST="${{ steps.latest.outputs.version }}"
          echo "Current: $CURRENT"
          echo "Latest:  $LATEST"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
            echo "New version detected, will trigger build."
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date, skipping."
          fi

      - name: Update version.txt
        if: steps.check.outputs.needed == 'true'
        run: |
          echo "${{ steps.check.outputs.new_version }}" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump OpenWrt to ${{ steps.check.outputs.new_version }}"
          git push

      - name: Trigger x86_64 build
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-openwrt.yml \
            -f target=x86_64 \
            -f version=${{ steps.check.outputs.new_version }} \
            -f lan_ip=192.168.1.1 \
            -f mode=main \
            -f gateway=192.168.1.1 \
            -f rootfs_size=512

      - name: Trigger mt7981 build
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-openwrt.yml \
            -f target=mt7981 \
            -f version=${{ steps.check.outputs.new_version }} \
            -f lan_ip=192.168.1.1 \
            -f mode=main \
            -f gateway=192.168.1.1 \
            -f rootfs_size=512
